<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ledgerly - Expense Tracker</title>
    <meta name="description" content="Collaborative group expense tracker with member balances, UPI quick top-up, spending analytics, and transaction history." />
    <meta property="og:title" content="Ledgerly - Expense Tracker" />
    <meta property="og:description" content="Collaborative group expense tracker with member balances, UPI quick top-up, spending analytics, and transaction history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var fontName = localStorage.getItem('ledgerly_font_theme') || 'Open Sans';
          var fonts = {
            'sf pro': '-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "San Francisco", "Helvetica Neue", "Inter", sans-serif',
            'roboto': '"Roboto", -apple-system, BlinkMacSystemFont, sans-serif',
            'inter': '"Inter", -apple-system, BlinkMacSystemFont, sans-serif',
            'open sans': '"Open Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            'poppins': '"Poppins", -apple-system, BlinkMacSystemFont, sans-serif',
            'aptos serif': '"Aptos Serif", "Lora", "Merriweather", Cambria, "Times New Roman", Georgia, serif',
            'aptos display': '"Aptos Display", "Aptos", "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif'
          };
          var ff = fonts[fontName.toLowerCase()] || fonts['open sans'];
          document.documentElement.style.setProperty('--app-font', ff);
          document.documentElement.style.setProperty('--font-sans', ff);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#eef2f7] text-slate-800 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
